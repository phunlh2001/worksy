appId: com.worksy.desktop
productName: Worksy
directories:
  output: dist

files:
  - 'out/**/*'

extraResources:
  - from: 'bin'
    to: 'bin'

win:
  target: nsis
  icon: resources/favicon.ico

nsis:
  artifactName: 'worksy-${version}.${ext}'
  installerIcon: resources/favicon.ico
  uninstallerIcon: resources/favicon.ico

publish:
  provider: github
  owner: phunlh2001
  repo: worksy
