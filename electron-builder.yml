appId: com.worksy.desktop
productName: Worksy
directories:
  output: release

files:
  - "out/**/*"

extraResources:
  - from: "bin"
    to: "bin"

win:
  target: nsis
  icon: resources/icon.png

nsis:
  artifactName: "worksy-${version}.${ext}"
  installerIcon: resources/icon.png
  uninstallerIcon: resources/icon.png

publish:
  provider: github
  owner: phunlh2001
  repo: worksy